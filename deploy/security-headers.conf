# Included in every location: nginx drops server-level add_header lines in any
# location that sets its own.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Everything else is same-origin; Plot and Pagefind set inline styles; Pagefind runs WebAssembly.
# The upload pages use Google Identity Services (script, style, button iframe), the upload API
# and signed PUTs to Cloud Storage. GIS needs the Referrer-Policy above to send the origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data:; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/ https://upload-api-1053795732732.us-central1.run.app https://storage.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
